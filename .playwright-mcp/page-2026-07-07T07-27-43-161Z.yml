                - paragraph [ref=f2e62]: Every blog needs a first post. So here we are.
                - heading "Who I am" [level=2] [ref=f2e63]:
                  - img [ref=f2e65] [cursor=pointer]
                  - text: Who I am
                - paragraph [ref=f2e68]: I'm a senior technology leader — currently CTO at Powerdot — with a long career spent building software, leading engineering teams, and trying to stay genuinely curious about how things work. Outside of work, I spend time on my homelab, on my mountain bike, and increasingly in the gym. I read a lot, tinker often, and occasionally have opinions worth writing down.
                - heading "What this blog is" [level=2] [ref=f2e69]:
                  - img [ref=f2e71] [cursor=pointer]
                  - text: What this blog is
                - paragraph [ref=f2e74]: "This is my personal publishing space. No CMS, no editorial process — just an MDX file, a git push, and whatever I happen to be thinking about. The topics will follow my actual life: technology, fitness, homelab projects, things I've learned, things I've broken, and the occasional reflection on what it's like to do this job at this stage of a career."
                - heading "What this blog is not" [level=2] [ref=f2e75]:
                  - img [ref=f2e77] [cursor=pointer]
                  - text: What this blog is not
