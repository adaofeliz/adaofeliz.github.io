name: Generate GitOps Audio

on:
  workflow_dispatch:
    inputs:
      post_slug:
        description: 'Only generate this post slug (blank = every post still missing audio)'
        type: string
        required: false
      normalize_existing:
        description: 'Repair loudness of already published audio (uses no ElevenLabs credits)'
        type: boolean
        default: false
      normalize_force:
        description: 'Re-normalize even files already tagged as normalized'
        type: boolean
        default: false

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      # Load-bearing: the loudness repair chain shells out to ffmpeg.
      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install dependencies
        run: yarn install

      - name: Generate Audio for New Posts
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
        run: |
          node scripts/generate-audio.mjs ${{ inputs.post_slug && format('--only={0}', inputs.post_slug) || '' }}
          node scripts/backfill-timestamps.mjs

      - name: Repair loudness of existing audio
        if: ${{ inputs.normalize_existing }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
        run: node scripts/normalize-existing-audio.mjs ${{ inputs.normalize_force && '--force' || '' }}

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/blog/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(audio): inject elevenlabs tts audio url" && git push)
