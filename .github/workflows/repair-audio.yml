name: Repair Audio Loudness

# Narration is generated locally in the author's cloned voice (`yarn audio`),
# because the model needs Apple Silicon and the voice sample never leaves the
# laptop. CI only repairs the loudness of audio that is already published.

on:
  workflow_dispatch:
    inputs:
      normalize_force:
        description: 'Re-normalize even files already tagged as normalized'
        type: boolean
        default: false

jobs:
  repair-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      # Load-bearing: the repair chain shells out to ffmpeg. Bounded waits
      # because the runner's unattended-upgrades once held the apt lock >10 min.
      - name: Ensure ffmpeg is available
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
            exit 0
          fi
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: yarn install

      - name: Repair loudness of existing audio
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
        run: node scripts/normalize-existing-audio.mjs ${{ inputs.normalize_force && '--force' || '' }}
